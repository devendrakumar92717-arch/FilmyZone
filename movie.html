<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details - FilmyZone</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="movie-details-page">

    <img id="movieImage"
         src="images/latest/movie1.jpg"
         alt="Movie Poster">

    <h1 id="movieTitle">
        Movie Name
    </h1>

    <p>
        <strong>Genre:</strong>
        <span id="movieCategory">
            Action
        </span>
    </p>

    <p>
    <strong>Language:</strong>
    <span id="movieLanguage"></span>
</p>

<p>
    <strong>Release:</strong>
    <span id="movieYear"></span>
</p>

<div class="download-box">

    <button class="hd-btn"
        onclick="selectQuality('720p')">

        🔵 Normal HD Download

    </button>

    <button class="fullhd-btn"
        onclick="selectQuality('1080p')">

        🟢 Full HD Download

    </button>

</div>
    
<script src="movies.js"></script>
<script src="script.js"></script>
</body>
</html>
