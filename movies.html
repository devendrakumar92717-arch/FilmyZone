<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FILMY JOHN - All Movies</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header class="main-header">

<div class="logo">

<i class="fa-solid fa-film"></i>

<span>FILMY JOHN</span>

</div>

<nav class="header-nav">

<a href="index.html">

<i class="fa-solid fa-house"></i>

Home

</a>

<a href="movies.html"
class="active">

<i class="fa-solid fa-video"></i>

Movies

</a>

</nav>

</header>

<!-- ========================= -->
<!-- BANNER -->
<!-- ========================= -->

<section class="banner">

<button class="banner-btn prev">

<i class="fa-solid fa-chevron-left"></i>

</button>

<img
id="bannerImage"
src="images/banner1.jpg"
alt="Banner">

<button class="banner-btn next">

<i class="fa-solid fa-chevron-right"></i>

</button>

<div class="banner-dots">

<span class="active"></span>

<span></span>

<span></span>

<span></span>

<span></span>

</div>

</section>
<!-- ========================= -->
<!-- TRENDING MOVIES -->
<!-- ========================= -->

<section class="section">

<div class="section-title">

<h2>

🔥 Trending Movies

</h2>

<a href="movies.html">

View All

</a>

</div>

<div
class="movie-grid"
id="trendingMovieGrid">

</div>

</section>

<!-- ========================= -->
<!-- LATEST MOVIES -->
<!-- ========================= -->

  <!-- ========================= -->
<!-- LATEST MOVIES -->
<!-- ========================= -->

<section class="section">

<div class="section-title">

<h2>

🆕 Latest Movies

</h2>

<a href="movies.html">

View All

</a>

</div>

<div
class="movie-grid"
id="latestMovieGrid">

</div>

</section>

<!-- ========================= -->
<!-- SEARCH -->
<!-- ========================= -->

<section class="search-section">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="movieSearch"
placeholder="Search Movies...">

</div>

</section>

<!-- ========================= -->
<!-- ALL MOVIES -->
<!-- ========================= -->

<section class="movies-section">

<div
class="movie-grid"
id="allMovieGrid">

</div>

</section>

<!-- ========================= -->
<!-- PAGINATION -->
<!-- ========================= -->

<div class="pagination">

<button id="prevPage">

<i class="fa-solid fa-angle-left"></i>

Previous

</button>

<span id="pageNumber">

Page 1

</span>

<button id="nextPage">

Next

<i class="fa-solid fa-angle-right"></i>

</button>

</div>
<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<footer class="footer">

<p>

© 2026 FILMY JOHN | All Rights Reserved

</p>

</footer>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="movies.js"></script>

<script src="script.js"></script>

</body>
</html>
