<section class="download-container">

    <div class="download-card">

        <img
        id="moviePoster"
        class="download-poster"
        src=""
        alt="Movie">

        <h2 id="movieTitle">
            Loading...
        </h2>

        <div class="quality-box">

            <div class="quality-item">

                <h3>🟢 Normal HD</h3>

                <p id="size720">
                    Size : --
                </p>

                <button id="download720">

                    ⬇ Download

                </button>

            </div>

            <div class="quality-item">

                <h3>🔵 Full HD</h3>

                <p id="size1080">
                    Size : --
                </p>

                <button id="download1080">

                    ⬇ Download

                </button>

            </div>

        </div>

        <div class="download-note">

            ⚠️ Fast Internet Recommended

        </div>

        <button
        class="back-btn"
        onclick="history.back()">

            ⬅ Back

        </button>

    </div>

</section>

<script src="movies.js"></script>
<script src="download.js"></script>

</body>
</html>
