<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details - FilmyZone</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="movie-details-page">

    <img id="movieImage"
         src="images/latest/movie1.jpg"
         alt="Movie Poster">

    <h1 id="movieTitle">
        Movie Name
    </h1>

    <p>
        <strong>Genre:</strong>
        <span id="movieCategory">
            Action
        </span>
    </p>

    <p>
        <strong>Language:</strong>
        Hindi
    </p>

    <p>
        <strong>Release:</strong>
        2026
    </p>

    <button class="download-btn">

        <i class="fa-solid fa-download"></i>

        Download Movie

    </button>

    <p id="selectedQuality" style="margin-top:15px;
font-weight:bold;
color:#00e676;
text-align:center;">
No Quality Selected
    </p>
<button onclick="selectQuality('720p')" class="big-download-btn normal-btn">
    🔵 Normal HD Download
</button>

<button onclick="selectQuality('1080p')" class="big-download-btn full-btn">
    🟢 Full HD Download
</button>
<div class="download-quality">

    <button class="big-download-btn normal-btn"
        onclick="selectQuality('720p')">

        🔵 Normal HD Download

    </button>

    <button class="big-download-btn full-btn"
        onclick="selectQuality('1080p')">

        🟢 Full HD Download

    </button>

</div>
    
<div id="generateLinkBox" style="display:none;">

    <h3>🔗 Generating Download Link...</h3>

    <p>Please wait 3–5 seconds...</p>

    <div class="progress">

        <div id="progressBar"></div>

    </div>

    <p id="progressText">0%</p>

</div>

<div id="downloadReadyBox" style="display:none;">

    <h3>✅ Download Link Generated Successfully</h3>

</div>
<div class="movie-info">

<script src="movies.js"></script>
<script src="script.js"></script>
</body>
</html>
